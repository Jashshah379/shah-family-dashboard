name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          mkdir _site
          # Previously this only copied index.html — every other file
          # (icons, favicon, manifest.json, sw.js) was silently dropped from
          # every deployment despite being correctly committed to the repo.
          # That's the real reason the app icon, favicon, and service worker
          # never actually updated on the live site all session.
          cp index.html _site/
          cp .nojekyll _site/
          cp manifest.json _site/ 2>/dev/null || true
          cp sw.js _site/ 2>/dev/null || true
          cp *.png _site/ 2>/dev/null || true
          cp *.ico _site/ 2>/dev/null || true
          cp *.json _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
